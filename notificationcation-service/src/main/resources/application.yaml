server:
  port: 8082
  servlet:
    context-path: /notification
spring:
  application:
    name: notification-service
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.LoanManagerment.event.dto.messageOtpDto
notification:
  sms:
    brevo-url: https://api.brevo.com/v3
    brevo-apikey: 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

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/